name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install --dev

    - name: Build
      run: npm run bundle

    - name: Version
      id: version
      run: |-
        echo PLUGIN_VERSION="$(npm run --silent version)" >> "$GITHUB_OUTPUT"
        git log $(git describe --tags --abbrev=0)..HEAD --oneline > changes.txt

    - name: Create or update draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: "v${{ steps.version.outputs.PLUGIN_VERSION }}"
      run: |
        release_state=$(gh release view "$TAG" \
          --json isDraft,isPrerelease \
          --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "published" end' \
          2>/dev/null || true)

        if [ "$release_state" = "published" ]; then
          echo "Release $TAG is already published; skipping update."
        elif [ -n "$release_state" ]; then
          gh release edit "$TAG" --notes-file changes.txt
          gh release upload "$TAG" query-params-conditional-visibility.zip --clobber
        else
          gh release create "$TAG" query-params-conditional-visibility.zip \
            --draft \
            --notes-file changes.txt \
            --target "$GITHUB_SHA" \
            --title "$TAG"
        fi
